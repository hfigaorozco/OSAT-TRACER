{% load static %}
<aside class="sidebar" id="main-sidebar">

  <button class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle menú">
    <svg class="icon-menu" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
    <svg class="icon-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <nav class="sidebar-nav">

    <a href="{% url 'operator_dashboard' %}"
       class="nav-item {% if request.resolver_match.url_name == 'operator_dashboard' %}active{% endif %}"
       title="Inicio">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="nav-label">Inicio</span>
    </a>

    <a href="{% url 'operator_mis_lotes' %}"
       class="nav-item {% if 'mis_lotes' in request.resolver_match.url_name %}active{% endif %}"
       title="Mis lotes">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span class="nav-label">Mis lotes</span>
    </a>

    <a href="{% url 'operator_notificaciones' %}"
       class="nav-item {% if 'notificaciones' in request.resolver_match.url_name %}active{% endif %}"
       title="Notificaciones" style="position:relative;">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="nav-label">Notificaciones</span>
      {% if unread_count %}<span class="nav-badge">{{ unread_count }}</span>{% endif %}
    </a>

    <a href="{% url 'operator_perfil' %}"
       class="nav-item {% if 'perfil' in request.resolver_match.url_name %}active{% endif %}"
       title="Mi perfil">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="nav-label">Mi perfil</span>
    </a>

  </nav>

  <div class="sidebar-footer">
    <a href="{% url 'logout' %}" class="nav-item" title="Cerrar sesión">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="nav-label">Cerrar sesión</span>
    </a>
  </div>

</aside>
