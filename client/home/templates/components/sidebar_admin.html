{% load static %}
<aside class="sidebar" id="main-sidebar">

  <!-- Botón hamburguesa / flecha — siempre visible, centrado arriba -->
  <button class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle menú" id="sidebar-toggle">
    <!-- Hamburguesa (sidebar cerrada) -->
    <svg class="icon-menu" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
    <!-- Flecha izquierda (sidebar abierta) -->
    <svg class="icon-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <nav class="sidebar-nav">

    <a href="{% url 'admin_dashboard' %}"
       class="nav-item {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}"
       title="Dashboard">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span class="nav-label">Dashboard</span>
    </a>

    <a href="{% url 'admin_produccion' %}"
       class="nav-item {% if 'produccion' in request.resolver_match.url_name %}active{% endif %}"
       title="Producción">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span class="nav-label">Producción</span>
    </a>

    <a href="{% url 'admin_inventario' %}"
       class="nav-item {% if 'inventario' in request.resolver_match.url_name %}active{% endif %}"
       title="Inventario">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73L13 2.27a2 2 0 0 0-2 0L4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <span class="nav-label">Inventario</span>
    </a>

    <a href="{% url 'admin_maquinaria' %}"
       class="nav-item {% if 'maquinaria' in request.resolver_match.url_name %}active{% endif %}"
       title="Maquinaria">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span class="nav-label">Maquinaria</span>
    </a>

    <a href="{% url 'admin_personal' %}"
       class="nav-item {% if 'personal' in request.resolver_match.url_name or 'cuentas' in request.resolver_match.url_name %}active{% endif %}"
       title="Personal">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span class="nav-label">Personal</span>
    </a>

    <a href="{% url 'admin_organizacion' %}"
       class="nav-item {% if 'organizacion' in request.resolver_match.url_name %}active{% endif %}"
       title="Organización">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/>
        <rect x="9.5" y="16" width="5" height="5"/>
        <line x1="5.5" y1="8" x2="5.5" y2="14"/><line x1="18.5" y1="8" x2="18.5" y2="14"/>
        <line x1="5.5" y1="14" x2="12" y2="16"/><line x1="18.5" y1="14" x2="12" y2="16"/>
      </svg>
      <span class="nav-label">Organización</span>
    </a>

    <a href="{% url 'admin_reportes' %}"
       class="nav-item {% if 'reportes' in request.resolver_match.url_name %}active{% endif %}"
       title="Reportes">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span class="nav-label">Reportes</span>
    </a>

    <a href="{% url 'admin_notificaciones' %}"
       class="nav-item {% if 'notificaciones' in request.resolver_match.url_name %}active{% endif %}"
       title="Alertas" style="position:relative;">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="nav-label">Alertas</span>
      {% if unread_count %}<span class="nav-badge">{{ unread_count }}</span>{% endif %}
    </a>

  </nav>

  <div class="sidebar-footer">
    <a href="{% url 'admin_configuracion' %}"
       class="nav-item {% if 'configuracion' in request.resolver_match.url_name %}active{% endif %}"
       title="Configuración">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="nav-label">Configuración</span>
    </a>
    <a href="{% url 'logout' %}" class="nav-item" title="Cerrar sesión">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="nav-label">Cerrar sesión</span>
    </a>
  </div>

</aside>
