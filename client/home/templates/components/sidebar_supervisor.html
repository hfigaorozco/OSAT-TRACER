{% load static %}
<aside class="sidebar" id="main-sidebar">

  <button class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle menú">
    <svg class="icon-menu" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
    <svg class="icon-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <nav class="sidebar-nav">

    <a href="{% url 'supervisor_dashboard' %}"
       class="nav-item {% if request.resolver_match.url_name == 'supervisor_dashboard' %}active{% endif %}"
       title="Dashboard">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span class="nav-label">Dashboard</span>
    </a>

    <a href="{% url 'supervisor_ordenes' %}"
       class="nav-item {% if 'ordenes' in request.resolver_match.url_name %}active{% endif %}"
       title="Producción">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span class="nav-label">Producción</span>
    </a>

    <a href="{% url 'supervisor_inventario' %}"
       class="nav-item {% if 'inventario' in request.resolver_match.url_name %}active{% endif %}"
       title="Inventario">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73L13 2.27a2 2 0 0 0-2 0L4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <span class="nav-label">Inventario</span>
    </a>

    <a href="{% url 'supervisor_reportes' %}"
       class="nav-item {% if 'reportes' in request.resolver_match.url_name %}active{% endif %}"
       title="Reportes">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span class="nav-label">Reportes</span>
    </a>

    <a href="{% url 'supervisor_notificaciones' %}"
       class="nav-item {% if 'notificaciones' in request.resolver_match.url_name %}active{% endif %}"
       title="Alertas" style="position:relative;">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="nav-label">Alertas</span>
      {% if unread_count %}<span class="nav-badge">{{ unread_count }}</span>{% endif %}
    </a>

  </nav>

  <div class="sidebar-footer">
    <a href="{% url 'logout' %}" class="nav-item" title="Cerrar sesión">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="nav-label">Cerrar sesión</span>
    </a>
  </div>

</aside>
